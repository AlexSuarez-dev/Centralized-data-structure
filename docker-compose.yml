services:
  # 1. Database
  mysql-db:
    image: mysql:8.0
    container_name: inventario-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Only run the first time the mysql_data volume is created, in alphabetical order.
      # On an existing database, apply new migrations by hand (see README).
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/migrations/001_estat_enum_usuaris.sql:/docker-entrypoint-initdb.d/02-001_estat_enum_usuaris.sql
      - ./database/migrations/002_correccio_portatils.sql:/docker-entrypoint-initdb.d/03-002_correccio_portatils.sql
      - ./database/migrations/004_estat_cpus.sql:/docker-entrypoint-initdb.d/05-004_estat_cpus.sql
    networks:
      - inventario-net
    restart: unless-stopped

  # 2. Backend (Spring Boot) - only reachable through the frontend's /api/ proxy
  backend:
    build:
      context: ./inventory-backend
      dockerfile: Dockerfile
    container_name: inventario-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    depends_on:
      - mysql-db
    networks:
      - inventario-net
    restart: unless-stopped

  # 3. Frontend (Nginx serving static files + proxy /api/ to the backend)
  frontend:
    image: nginx:alpine
    container_name: inventario-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - inventario-net
      - global-router
    restart: unless-stopped

networks:
  inventario-net:
    driver: bridge
  global-router:
    external: true

volumes:
  mysql_data:
