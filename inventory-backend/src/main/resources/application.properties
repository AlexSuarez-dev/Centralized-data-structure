# Configuración base (versionada). NUNCA poner aquí credenciales.
# - En Docker, la conexión llega por variables de entorno (docker-compose.yml las toma de .env).
# - En local, usar el perfil "local" (application-local.properties, no versionado).
spring.application.name=inventory

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bbddinventari?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# El esquema lo gestionan los scripts de database/ (init.sql + migrations), no Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Configuración Subida Archivos (Para que admita Excels grandes si hace falta)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Errores en formato Problem Detail (RFC 9457): el motivo de un 400/404/409 llega en el campo "detail"
spring.mvc.problemdetails.enabled=true

# Detrás de dos Nginx (hub + frontend): respeta X-Forwarded-Prefix/Proto para generar URLs correctas
server.forward-headers-strategy=framework

# Swagger / OpenAPI bajo /api para que pase por el proxy /api/ del frontend
# (a través del hub: /inventario/api/docs)
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
